<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Desk</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#34362d;font:15px 'Segoe UI',sans-serif;min-height:100vh;padding:40px 7vw}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d4d1c7;padding-bottom:20px}.logo{font-size:19px;font-weight:600;letter-spacing:-.5px}.logo span{color:#8d7ca8;margin-right:10px}.tag{font-size:10px;letter-spacing:2px;color:#89907f}main{max-width:760px;margin:55px auto}h1{font-family:Georgia,serif;font-size:47px;font-weight:400;letter-spacing:-1.5px;margin:0 0 12px}p{color:#818775;font-size:13px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:38px}.panel{background:#f8f6f0;border:1px solid #dedbd0;border-radius:15px;padding:30px}.eyebrow{font-size:9px;letter-spacing:2px;color:#969881}#time{font-size:62px;letter-spacing:-3px;font-weight:300;font-variant-numeric:tabular-nums;margin:28px 0 25px}button{cursor:pointer;font:12px 'Segoe UI',sans-serif;border:0;border-radius:6px;padding:11px 17px;background:#d8caed;color:#4f3d68}button:hover{filter:brightness(.97)}.secondary{background:#e9e7de;color:#71785f;margin-left:8px}textarea{width:100%;resize:vertical;min-height:163px;background:none;border:0;outline-color:#b9a0d4;font:15px/1.8 Georgia,serif;color:#5b604e;margin-top:24px}footer{margin-top:25px;display:flex;justify-content:space-between;align-items:center;gap:20px}#status{font-size:11px;color:#8a907b}.native{background:transparent;border:1px solid #cfc9db;color:#7d6b96}#saved{font-size:10px;color:#9c9d8d;float:right}.hint{margin-top:25px;font-size:10px;color:#9d9f90}@media(max-width:650px){.layout{grid-template-columns:1fr}main{margin-top:30px}h1{font-size:35px}}
</style></head><body><header><div class="logo"><span>✳</span> Focus Desk</div><span class="tag">A LITTLE SPACE TO THINK</span></header><main><h1>One thing at a time.</h1><p>Clear your head. Choose your focus. Make a little progress.</p><div class="layout"><section class="panel"><div class="eyebrow">YOUR NEXT 25 MINUTES</div><div id="time">25:00</div><button id="start">Start focusing →</button><button id="reset" class="secondary">Reset</button></section><section class="panel"><div class="eyebrow">WHAT MATTERS TODAY <span id="saved">SAVED HERE</span></div><textarea id="notes" aria-label="Focus notes" placeholder="One small thing I want to finish…"></textarea></section></div><footer><span id="status">Ready when you are.</span><div><button id="notify" class="native">Test notification</button><button id="pin" class="native">Keep on top ↗</button></div></footer><p class="hint">Your notes are saved on this computer. Native features ask for your permission.</p></main><script>
const time=document.getElementById('time'),start=document.getElementById('start'),notes=document.getElementById('notes'),status=document.getElementById('status');
let remaining=1500,deadline=0,timer=null,pinned=false;
notes.value=localStorage.getItem('notes')||'';notes.oninput=()=>localStorage.setItem('notes',notes.value);
function paint(){time.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');}
start.onclick=()=>{if(timer){clearInterval(timer);timer=null;start.textContent='Keep going →';status.textContent='A moment to breathe.';return;}deadline=Date.now()+remaining*1000;start.textContent='Pause';status.textContent='You have a little space. Use it well.';timer=setInterval(async()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));paint();if(!remaining){clearInterval(timer);timer=null;start.textContent='Start again →';remaining=1500;status.textContent='A little progress. Time for a break.';try{await window.appdock?.notify('Focus complete','Take a break. You earned it.');}catch(e){status.textContent=e.message;}}},250);};
document.getElementById('reset').onclick=()=>{clearInterval(timer);timer=null;remaining=1500;paint();start.textContent='Start focusing →';status.textContent='Ready when you are.';};
document.getElementById('pin').onclick=async()=>{try{if(!window.appdock)throw new Error('Open this app through AppDock to use native features.');await window.appdock.alwaysOnTop(!pinned);pinned=!pinned;document.getElementById('pin').textContent=pinned?'Unpin window ↙':'Keep on top ↗';}catch(e){status.textContent=e.message;}};
document.getElementById('notify').onclick=async()=>{try{if(!window.appdock)throw new Error('Open this app through AppDock to use native features.');await window.appdock.notify('A little focus goes a long way.','Your desktop app can send native notifications.');status.textContent='Notification sent.';}catch(e){status.textContent=e.message;}};
</script></body></html>
