name: Create verified draft release
on:
  workflow_dispatch:
    inputs:
      verified_run:
        description: Successful Build and exercise desktop apps run ID for this exact commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node scripts/validate-release-tag.cjs
      - run: node scripts/verify-build-run.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified_run }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-build-record
          path: verified-build.json
          retention-days: 1
  draft:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-build-record
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: make-app-*
          run-id: ${{ inputs.verified_run }}
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true
      - run: node scripts/verify-release-assets.cjs
      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          gh release create "v$version" artifacts/public-release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Make App $version — Desktop and web preview" --notes-file docs/RELEASE_NOTES.md --draft --prerelease
