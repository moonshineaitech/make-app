name: Verify source and plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/codex/package-lock.json
      - run: npm ci
      - run: npm run public:check
      - run: npm run build:supervisor
      - run: npm run build:launcher
      - run: npm test
      - run: npm run build:site
      - run: npm run test:design
      - run: npm run test:aero
      - run: npm run test:views
      - run: npm run test:originals
      - run: npm run test:motion
      - run: npm run test:usability
      - run: npm ci --prefix integrations/codex
      - run: npm run build:plugin
      - run: npm run test:plugin
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix integrations/codex --audit-level=moderate
